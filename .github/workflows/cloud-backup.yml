name: Automated Cloud Backup (Supabase -> Encrypted Artifact)

on:
  schedule:
    # Corre todos los días a las 05:00 UTC (00:00 hora Perú)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub con un botón

permissions:
  contents: read

concurrency:
  group: 'cloud-backup'
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup credentials configuration
        id: check_creds
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_EMAIL: ${{ secrets.SUPABASE_BACKUP_EMAIL }}
          SUPABASE_BACKUP_PASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && { [ -z "$SUPABASE_BACKUP_EMAIL" ] || [ -z "$SUPABASE_BACKUP_PASSWORD" ]; }; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY no está configurado en Secrets. Se omite el respaldo automático sin fallar el workflow."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        if: steps.check_creds.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Extraer respaldo de Supabase y rotar snapshots locales al runner
        if: steps.check_creds.outputs.configured == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_EMAIL: ${{ secrets.SUPABASE_BACKUP_EMAIL }}
          SUPABASE_BACKUP_PASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
        run: node scripts/cloud-backup.mjs

      - name: Upload backup as private workflow artifact (never commit PII to public git)
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glow-with-pipo-supabase-backup-${{ github.run_number }}
          path: backups/
          if-no-files-found: error
          retention-days: 30
